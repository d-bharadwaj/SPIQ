[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spiq"
version = "0.1.0"
description = "Clifford-based QAOA initialization with multi-start point selection"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.10",
    "networkx>=3.0",
    "rustworkx>=0.14",
    "qiskit>=1.3",
    "qiskit-aer>=0.16",
    "qiskit-algorithms>=0.3",
    "qiskit-optimization>=0.6",
    "qiskit-ibm-runtime>=0.34",
    "pygad>=3.3",
    "stim>=1.14",
    "qubovert>=1.2",
    "multiprocess>=0.70",
    "scikit-learn>=1.3",
    "psutil>=5.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["clapton*", "spiq*", "biomarker_data*", "red_qaoa*"]

[tool.setuptools.package-data]
biomarker_data = ["samples/**/*"]
